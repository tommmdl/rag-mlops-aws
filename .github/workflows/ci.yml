name: RAG MLOps CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  PYTHON_VERSION: "3.12"

jobs:
  # ─── LINT + TESTES LOCAIS ─────────────────────────────────────────────────
  lint-and-test:
    name: Lint + Test local
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instala dependências
        run: pip install ruff pytest -r requirements.txt

      - name: Lint (ruff)
        run: ruff check src/ scripts/ streamlit/

      - name: Testa chunking local
        run: |
          cd src/ingestion
          python3 -c "
          from chunker import chunk_document
          chunks = chunk_document('word ' * 1000, chunk_size=100, overlap=10)
          assert len(chunks) > 0, 'chunker falhou'
          print(f'✅ chunker OK: {len(chunks)} chunks gerados')
          "

      - name: Testa ingestão local
        run: |
          python3 scripts/ingest.py --local --docs-dir docs/

  # ─── TERRAFORM VALIDATE ───────────────────────────────────────────────────
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8"

      - name: Terraform Format Check
        run: cd terraform && terraform fmt -check -recursive

      - name: Terraform Init (sem backend)
        run: |
          cd terraform
          terraform init -backend=false

      - name: Terraform Validate
        run: cd terraform && terraform validate

  # ─── DEPLOY (só na main, com aprovação manual) ─────────────────────────────
  deploy:
    name: Deploy para AWS
    runs-on: ubuntu-latest
    needs: [lint-and-test, terraform-validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production  # requer aprovação no GitHub

    permissions:
      id-token: write   # necessário para OIDC
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — sem chaves de longa duração)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Terraform Init
        run: cd terraform && terraform init

      - name: Terraform Plan
        run: cd terraform && terraform plan -out=tfplan

      - name: Terraform Apply
        run: cd terraform && terraform apply tfplan

      - name: Ingestão de documentos
        run: |
          API_URL=$(cd terraform && terraform output -raw api_gateway_url)
          echo "API_URL=$API_URL" >> $GITHUB_ENV
          python3 scripts/ingest.py --api-url $API_URL --docs-dir docs/

      - name: Health Check pós-deploy
        run: |
          sleep 5
          curl -f "${{ env.API_URL }}/health" | python3 -m json.tool

      - name: Summary do deploy
        run: |
          echo "## Deploy concluído 🚀" >> $GITHUB_STEP_SUMMARY
          echo "- API: ${{ env.API_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- Região: ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
